name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polya
          POSTGRES_PASSWORD: polya
          POSTGRES_DB: polya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polya"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://polya:polya@localhost:5432/polya
      APP_URL: http://localhost:3000
      TEACHER_EMAILS: teacher@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  pdf-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pdf-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runner -t polya-web web
      - run: docker build -t polya-pdf pdf-service
